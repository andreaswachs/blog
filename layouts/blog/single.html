{{ define "main" }}
{{ if .Title }}
<h1>{{ .Title }}</h1>
{{ end }}
{{ if .Date }}
<p style="font-size:0.85em;opacity:0.6;margin-bottom:1.5em">
  <time datetime="{{ .Date.Format "2006-01-02" }}">
    {{ .Date.Format (default "02 Jan, 2006" .Site.Params.dateFormat) }}
  </time>
</p>
{{ end }}

<content>
{{ partial "audio-player.html" . }}
{{ .Content }}
</content>
{{ end }}
