<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --font-main: "EB Garamond", serif;
    --font-secondary: "JetBrains Mono", monospace;
    --font-code: "Fira Code", "JetBrains Mono", monospace;
  }

  h1, h2, h3, h4, h5, h6 {
    font-weight: 500;
  }

  .highlight {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    margin: 0.35em 0;
    outline: 1px solid rgba(255,255,255,0.06);
  }

  .highlight pre {
    padding: 0.05em 0.7em;
    margin: 0;
    line-height: 1.25;
    white-space: pre-wrap !important;
    word-break: break-word !important;
    width: 100% !important;
    min-width: 0 !important;
    max-width: 100%;
    box-sizing: border-box;
  }

  .highlight pre code {
    white-space: pre-wrap !important;
    word-break: break-word !important;
  }

  .highlight pre code span[style*="display:flex"] {
    display: block !important;
    width: 100%;
  }

  .highlight code {
    font-family: var(--font-code);
  }

  .copy-btn {
    position: absolute;
    top: 0.5em;
    right: 0.5em;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 1.8em;
    height: 1.8em;
    padding: 0;
    border: none;
    border-radius: 5px;
    background: rgba(0,0,0,0.25);
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .copy-btn svg {
    width: 1em;
    height: 1em;
  }

  .copy-btn:hover {
    background: rgba(0,0,0,0.4);
    color: rgba(255,255,255,0.85);
  }

  .copy-btn.copied {
    color: #a3be8c;
    background: rgba(0,0,0,0.35);
  }

  p code,
  li code {
    font-size: 0.875em;
    background: rgba(125,125,125,0.1);
    padding: 0.15em 0.4em;
    border-radius: 4px;
  }

  blockquote[data-alert] {
    padding: 0.6em 1em;
    margin: 1em 0;
    border-left: 4px solid;
    border-radius: 6px;
  }

  blockquote[data-alert] p {
    margin: 0.3em 0;
  }

  blockquote[data-alert] p:first-child::before {
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.8em;
    letter-spacing: 0.04em;
    display: block;
    margin-bottom: 0.3em;
  }

  blockquote[data-alert="note"] {
    background: rgba(9,105,218,0.08);
    border-color: #0969da;
  }
  blockquote[data-alert="note"] p:first-child::before {
    content: "Note";
    color: #0969da;
  }

  blockquote[data-alert="tip"] {
    background: rgba(26,127,55,0.08);
    border-color: #1a7f37;
  }
  blockquote[data-alert="tip"] p:first-child::before {
    content: "Tip";
    color: #1a7f37;
  }

  blockquote[data-alert="important"] {
    background: rgba(130,80,223,0.08);
    border-color: #8250df;
  }
  blockquote[data-alert="important"] p:first-child::before {
    content: "Important";
    color: #8250df;
  }

  blockquote[data-alert="warning"] {
    background: rgba(154,103,0,0.08);
    border-color: #9a6700;
  }
  blockquote[data-alert="warning"] p:first-child::before {
    content: "Warning";
    color: #9a6700;
  }

  blockquote[data-alert="caution"] {
    background: rgba(207,34,46,0.08);
    border-color: #cf222e;
  }
  blockquote[data-alert="caution"] p:first-child::before {
    content: "Caution";
    color: #cf222e;
  }
</style>
