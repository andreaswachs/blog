{{ if .Params.audio_file }}
<div style="margin:1.5em 0;padding:0.75em 1em;border:1px solid rgba(125,125,125,0.15);border-radius:6px;background:rgba(125,125,125,0.03)">
  <p style="margin:0 0 0.5em;font-size:0.85em;opacity:0.7">
    🔊 Audio version available
  </p>
  <audio controls preload="none" style="width:100%;height:36px">
    <source src="{{ .Params.audio_file | relURL }}" type="audio/wav">
    Your browser does not support the audio element.
    <a href="{{ .Params.audio_file | relURL }}">Download audio file</a>
  </audio>
</div>
{{ end }}
