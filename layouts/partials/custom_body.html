<script>
document.querySelectorAll('blockquote').forEach(bq => {
  const p = bq.querySelector('p');
  if (!p) return;
  const m = p.textContent.match(/^\[!(\w+)\]/);
  if (!m) return;
  const type = m[1].toLowerCase();
  bq.dataset.alert = type;
  p.childNodes.forEach(n => {
    if (n.nodeType === 3) {
      const txt = n.textContent.replace(/^\[!\w+\]\s*/, '');
      if (txt) n.textContent = txt;
      else n.remove();
    }
  });
});

document.querySelectorAll('.highlight').forEach(block => {
  const btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  btn.addEventListener('click', () => {
    const code = block.querySelector('code');
    if (!code) return;
    navigator.clipboard.writeText(code.textContent).then(() => {
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
        btn.classList.remove('copied');
      }, 2000);
    });
  });
  block.appendChild(btn);
});
</script>

<!-- Mermaid diagram support -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
mermaid.initialize({ startOnLoad: false, theme: 'default' });
(function renderMermaid() {
  const codeBlocks = document.querySelectorAll('code.language-mermaid');
  if (codeBlocks.length === 0) return;
  codeBlocks.forEach(codeEl => {
    const pre = codeEl.parentElement;
    const container = document.createElement('div');
    container.className = 'mermaid';
    container.textContent = codeEl.textContent;
    pre.replaceWith(container);
  });
  mermaid.run();
})();
</script>
